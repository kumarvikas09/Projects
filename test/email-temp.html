<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>Email Template</title>
  </head>
  <body
    style="
      margin: 0;
      background: #f3f4f7;
      font-family:
        &quot;Roboto Mono&quot;, Consolas, &quot;Lucida Console&quot;,
        &quot;Courier New&quot;, monospace;
    "
  >
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      style="
        width: 100%;
        height: 100%;
        padding-top: 20px;
        padding-bottom: 20px;
        padding-left: 20px;
        padding-right: 20px;
      "
      width="100%"
    >
      <tr>
        <td align="center">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="
              max-width: 370px;
              width: 100%;
              background: #f8f8f8;
              box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;"
            width="100%"
          >
            <tr>
              <td align="center" style="padding: 30px 20px 20px">
                <img
                  alt="Solace Theory"
                  src="https://www.solacetheory.com/cdn/shop/files/SOLACE_THEORY_LOGO_SMALLER._0ba2968c-343b-4f65-be12-281db7ef27de_350x.png?v=1674135139"
                  style="
                    display: block;
                    border: 0;
                    max-width: 140px;
                    width: 90px;
                    height: auto;
                  "
                />
              </td>
            </tr>
            <tr>
              <td
                align="center"
                style="
                  padding: 0px 30px 40px;
                  font-size: 12.5px;
                  color: #000000;
                  line-height: 30px;
                  font-weight: 300;
                "
              >
                INTRODUCING SEDIMENT PROJECT
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 38px 25px;
                  font-size: 11.3px;
                  line-height: 1.5;
                  color: #000000;
                  text-align: left;
                  font-weight: 300;
                "
              >
                Each Solace Theory piece is produced in limited quantities, with
                careful consideration given to material, silhouette and
                longevity.
              </td>
            </tr>
            <tr>
              <td style="padding: 10px 38px">
                <img
                  alt="man wearing a hoodie"
                  src="https://www.solacetheory.com/cdn/shop/files/mail-temp.jpg?v=1784187223"
                  style="display: block; width: 100%; height: auto; border: 0"
                  width="370"
                />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 35px 20px 45px">
                <div
                  style="
                    font-size: 12px;
                    color: #000;
                    line-height: 1.6;
                    letter-spacing: 0.5px;
                    font-weight: 300;
                  "
                >
                  PASSWORD:
                  <span>WELCOMETOTHESEDIMENTPROJECT</span>
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding: 0 20px 25px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="table-layout: fixed"
                >
                  <tr>
                    <td width="25%" align="center" style="font-size: 10px">
                      <a
                        href="https://www.solacetheory.com"
                        style="color: #333333; text-decoration: none"
                      >
                        SHOP
                      </a>
                    </td>

                    <td width="25%" align="center" style="font-size: 10px">
                      <a
                        href="https://instagram.com/"
                        style="color: #333333; text-decoration: none"
                      >
                        INSTAGRAM
                      </a>
                    </td>

                    <td width="25%" align="center" style="font-size: 10px">
                      <a
                        href="https://www.solacetheory.com/pages/contact"
                        style="color: #333333; text-decoration: none"
                      >
                        CONTACT
                      </a>
                    </td>

                    <td width="25%" align="center" style="font-size: 10px">
                      <span style="color: #333333; text-decoration: none">
                        {% unsubscribe %}
                      </span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
