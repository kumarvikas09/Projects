<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shrink Transition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07070c;
            --primary: #8b5cf6;
            --primary-bright: #a78bfa;
            --secondary: #06b6d4;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --transition-cinematic: cubic-bezier(0.76, 0, 0.24, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            perspective: 1200px;
        }

        .navigation-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2000;
        }
        .nav-link {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
        }
        .nav-link:hover { background: rgba(255, 255, 255, 0.15); }

        .reset-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .reset-btn:hover { transform: translateY(-1px); }

        .mock-homepage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0e0d1c 0%, #030306 100%);
            z-index: 10;
            opacity: 0;
            transform: translate3d(0, 100px, -200px);
            transition: opacity 1.3s var(--transition-cinematic), transform 1.3s var(--transition-cinematic);
        }
        .mock-homepage.reveal { opacity: 1; transform: translate3d(0, 0, 0); }
        .mock-homepage h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .splash-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: radial-gradient(circle at center, #0f0c1b 0%, #050409 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: all 1.3s var(--transition-cinematic);
        }

        /* 3D Shrink/Minify Animation */
        .splash-container.transition-active {
            transform: translate3d(0, -100%, -400px) rotateX(45deg);
            opacity: 0;
            pointer-events: none;
        }
        .splash-container.transition-active .splash-content {
            transform: translateZ(100px) scale(0.8);
            opacity: 0;
            transition: transform 1.2s var(--transition-cinematic), opacity 1s ease;
        }

        .particles { position: absolute; width: 100%; height: 100%; opacity: 0.4; }
        .splash-content { text-align: center; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: all 1.2s var(--transition-cinematic); }
        .logo-svg { width: 100px; height: 100px; animation: spin 10s linear infinite; }
        .logo-ring { fill: none; stroke: var(--secondary); stroke-width: 1.5; }
        .splash-title { font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 800; letter-spacing: 0.5rem; }
        .enter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            letter-spacing: 0.15rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .enter-btn:hover { border-color: var(--primary-bright); color: var(--primary-bright); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="navigation-bar">
        <a href="transition_demo.html" class="nav-link">← DASHBOARD</a>
    </div>

    <button class="reset-btn" id="reset-btn">RESET</button>

    <div class="mock-homepage" id="mock-homepage">
        <h2>3D SHRINK</h2>
        <p>PERSPECTIVE SCALE BACKWARD ESCAPE REVEAL</p>
    </div>

    <div class="splash-container" id="splash-container">
        <canvas class="particles" id="particles-canvas"></canvas>
        <div class="splash-content">
            <svg class="logo-svg" viewBox="0 0 100 100">
                <circle class="logo-ring" cx="50" cy="50" r="45" />
                <polygon points="50,25 70,60 30,60" fill="none" stroke="#fff" stroke-width="2" />
            </svg>
            <h1 class="splash-title">A E T H E R I A</h1>
            <button class="enter-btn" id="enter-btn">ENTER EXPERIENCE</button>
        </div>
    </div>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const resetBtn = document.getElementById('reset-btn');
        const splashContainer = document.getElementById('splash-container');
        const mockHomepage = document.getElementById('mock-homepage');

        

        enterBtn.addEventListener('click', () => {
            splashContainer.classList.add('transition-active');
            mockHomepage.classList.add('reveal');
        });

        resetBtn.addEventListener('click', () => {
            splashContainer.classList.remove('transition-active');
            mockHomepage.classList.remove('reveal');
        });
    </script>
</body>
</html>
