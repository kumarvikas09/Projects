<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="cornerGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="cornerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Blue base arc -->
  <path d="M0,0 L180,0 C120,40 60,90 0,160 Z" fill="url(#cornerBlue)" opacity="0.9"/>
  <!-- Green crest arc -->
  <path d="M0,0 L320,0 C220,50 110,110 0,200 L0,150 C90,80 180,35 260,0 Z" fill="url(#cornerGreen)"/>
  <!-- White highlight line -->
  <path d="M0,155 C90,85 180,40 270,0" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
</svg>
