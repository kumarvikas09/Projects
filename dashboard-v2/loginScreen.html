<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./assets/css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/css/main-style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <div class="login_form_wrapper">
        <div class="login_form">
          <div class="logo_wrapper">
            <img src="./assets/images/main-logo.png" alt="main-logo">
          </div>
          <div class="head">
            <h2 class="main_hdng">Welcome Back!</h2>
            <p>Sign in to securely access the budget management and manage departmental financial data.</p>
          </div>
          <div class="form_wrap">
            <form>
              <div class="field email">
                <img src="./assets/images/mail.svg" alt="mail">
                <input type="email" placeholder="Email Address">
              </div>
              <div class="field password">
                <img src="./assets/images/lock.svg" alt="lock">
                <input type="password" placeholder="Password">
                <button type="button">
                  <img src="./assets/images/eye.svg" alt="eye">
                </button>
              </div>
              <div class="concent_wrap">
                <label>
                  <input type="checkbox" name="concent">
                  <span>Remember me</span>
                </label>
                <a href="#">Forgot password?</a>
              </div>
              <div class="submit_wrapper">
                <input type="submit" value="Sign In Now">
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script src="./assets/js/jquery/jquery.min.js"></script>
    <script src="./assets/js/chart/chart.js"></script>
    <script src="./assets/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/function.js"></script>
  </body>
</html>
